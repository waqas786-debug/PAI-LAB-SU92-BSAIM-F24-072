<!DOCTYPE html>
<html>
<head>
    <style>
        #chat-window { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h3>UniBot: Admission Assistant</h3>
    <div id="chat-window"></div>
    <input type="text" id="userInput" placeholder="Ask about programs, merit, etc.">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatWin = document.getElementById('chat-window');
            const msg = inputField.value;

            chatWin.innerHTML += `<div><b>You:</b> ${msg}</div>`;
            inputField.value = '';

            const res = await fetch('/process_query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: msg })
            });
            const data = await res.json();
            chatWin.innerHTML += `<div><b>Bot:</b> ${data.response}</div>`;
            chatWin.scrollTop = chatWin.scrollHeight;
        }
    </script>
</body>
</html>
