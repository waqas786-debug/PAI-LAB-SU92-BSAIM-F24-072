<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ResumeIQ — AI Job Match Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ─── Reset & Variables ──────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #080c10;
    --surface:   #0e1420;
    --surface2:  #141b27;
    --border:    #1e2b3f;
    --border2:   #253348;
    --accent:    #00d4ff;
    --accent2:   #7c3aed;
    --accent3:   #10b981;
    --warn:      #f59e0b;
    --danger:    #ef4444;
    --text:      #e2e8f0;
    --text-dim:  #64748b;
    --text-mid:  #94a3b8;
    --glow:      0 0 30px rgba(0,212,255,.15);
    --card-glow: 0 4px 32px rgba(0,0,0,.5);
    --radius:    14px;
    --radius-sm: 8px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── Background grid ────────────────────────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: .25;
    pointer-events: none;
  }

  /* ─── Header ─────────────────────────────────────────── */
  header {
    position: relative; z-index: 10;
    padding: 28px 48px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    background: rgba(8,12,16,.8);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800;
    letter-spacing: -.5px;
    color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 500;
    padding: 4px 10px; border-radius: 20px;
    background: rgba(0,212,255,.1);
    border: 1px solid rgba(0,212,255,.3);
    color: var(--accent);
    letter-spacing: .5px;
  }

  /* ─── Hero ───────────────────────────────────────────── */
  .hero {
    position: relative; z-index: 2;
    text-align: center;
    padding: 72px 24px 56px;
  }
  .hero-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: .8;
  }
  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(38px, 6vw, 72px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 20px;
  }
  .hero p {
    color: var(--text-mid);
    font-size: 17px;
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* ─── Main layout ─────────────────────────────────────── */
  main {
    position: relative; z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ─── Input Panel ────────────────────────────────────── */
  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 28px;
  }
  @media(max-width:768px){ .input-grid{ grid-template-columns:1fr; } }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color .3s;
  }
  .panel:focus-within { border-color: var(--accent); box-shadow: var(--glow); }

  .panel-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--text-mid);
    display: flex; align-items: center; gap: 8px;
  }
  .panel-title svg { color: var(--accent); }

  .char-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  textarea {
    width: 100%;
    min-height: 220px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    line-height: 1.7;
    padding: 18px 20px;
    resize: vertical;
  }
  textarea::placeholder { color: var(--text-dim); }

  /* ─── File Upload ────────────────────────────────────── */
  .upload-zone {
    margin: 0 20px 16px;
    border: 1.5px dashed var(--border2);
    border-radius: var(--radius-sm);
    padding: 14px;
    text-align: center;
    cursor: pointer;
    transition: all .25s;
    position: relative;
  }
  .upload-zone:hover { border-color: var(--accent); background: rgba(0,212,255,.04); }
  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-zone-text {
    font-size: 12px;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .upload-zone-text span { color: var(--accent); font-weight: 500; }
  .file-name {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--accent3);
    margin-top: 6px; display: none;
  }

  /* ─── Analyze Button ─────────────────────────────────── */
  .analyze-wrap { text-align: center; margin-bottom: 52px; }

  .btn-analyze {
    font-family: 'Syne', sans-serif;
    font-size: 16px; font-weight: 700;
    letter-spacing: .5px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    padding: 18px 56px;
    border-radius: 100px;
    cursor: pointer;
    transition: all .25s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,212,255,.25);
  }
  .btn-analyze:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,212,255,.4);
  }
  .btn-analyze:active { transform: translateY(0); }
  .btn-analyze:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .btn-analyze .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    margin-right: 10px;
  }
  @keyframes spin{ to{transform:rotate(360deg)} }
  .btn-analyze.loading .spinner { display: inline-block; }
  .btn-analyze.loading .btn-label { opacity: .7; }

  /* ─── Error Banner ───────────────────────────────────── */
  .error-banner {
    display: none;
    background: rgba(239,68,68,.12);
    border: 1px solid rgba(239,68,68,.35);
    color: #fca5a5;
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 24px;
    text-align: center;
  }

  /* ─── Results Section ────────────────────────────────── */
  #results { display: none; animation: fadeUp .5s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .results-header {
    font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .results-header::after {
    content: ''; flex: 1; height: 1px;
    background: var(--border);
  }

  /* ─── Score Hero Card ────────────────────────────────── */
  .score-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 32px;
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .score-hero::before {
    content: '';
    position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
    width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,255,.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .score-ring {
    width: 160px; height: 160px;
    margin: 0 auto 24px;
    position: relative;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring circle {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
  }
  .ring-bg  { stroke: var(--border2); }
  .ring-fill{ stroke: var(--accent); }

  .score-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .score-number {
    font-family: 'Syne', sans-serif;
    font-size: 42px; font-weight: 800;
    color: var(--text);
    line-height: 1;
  }
  .score-pct { font-size: 18px; color: var(--text-mid); font-weight: 400; }

  .score-label {
    font-family: 'Syne', sans-serif;
    font-size: 20px; font-weight: 700;
    margin-bottom: 8px;
  }
  .score-sub { color: var(--text-mid); font-size: 13.5px; }

  /* ─── Sub-score Grid ─────────────────────────────────── */
  .subscore-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  @media(max-width:768px){ .subscore-grid{ grid-template-columns:repeat(2,1fr); } }

  .subscore-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 18px 16px;
  }
  .subscore-name {
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .subscore-val {
    font-family: 'Syne', sans-serif;
    font-size: 26px; font-weight: 700;
    margin-bottom: 8px;
  }
  .mini-bar-track {
    height: 4px; border-radius: 2px;
    background: var(--border2);
    overflow: hidden;
  }
  .mini-bar-fill {
    height: 100%; border-radius: 2px;
    transition: width 1s ease .3s;
  }

  /* ─── Skills Grid ────────────────────────────────────── */
  .skills-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  @media(max-width:640px){ .skills-grid{ grid-template-columns:1fr; } }

  .skill-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .skill-card-title {
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .skill-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .tag {
    font-family: 'DM Mono', monospace;
    font-size: 11.5px;
    padding: 4px 11px; border-radius: 20px;
    display: inline-block;
    transition: transform .15s;
  }
  .tag:hover { transform: scale(1.05); }
  .tag-green { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); color: #6ee7b7; }
  .tag-red   { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.3);  color: #fca5a5; }
  .tag-blue  { background: rgba(124,58,237,.12); border: 1px solid rgba(124,58,237,.3); color: #c4b5fd; }
  .tag-yellow{ background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); color: #fcd34d; }
  .tag-cyan  { background: rgba(0,212,255,.1);  border: 1px solid rgba(0,212,255,.25); color: var(--accent); }

  .empty-skills {
    font-size: 12px; color: var(--text-dim); font-style: italic;
  }

  /* ─── Recommendations ────────────────────────────────── */
  .recs-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
  }
  .recs-title {
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-mid);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .rec-item {
    display: flex; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px; color: var(--text-mid);
    line-height: 1.55;
  }
  .rec-item:last-child { border-bottom: none; padding-bottom: 0; }
  .rec-icon { color: var(--accent); flex-shrink: 0; margin-top: 2px; }

  /* ─── Keywords ───────────────────────────────────────── */
  .keywords-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
  }
  .keywords-title {
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-mid);
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-dot"></div>
    ResumeIQ
  </div>
  <div class="badge">NLP Powered</div>
</header>

<!-- Hero -->
<div class="hero">
  <div class="hero-tag">&#9670; AI-Powered Analysis</div>
  <h1>Match Your Resume<br>to Any Job</h1>
  <p>Instant NLP analysis. See your match score, missing skills, and actionable recommendations.</p>
</div>

<!-- Main -->
<main>

  <!-- Error -->
  <div class="error-banner" id="errorBanner"></div>

  <!-- Input Grid -->
  <div class="input-grid">

    <!-- Resume Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
          Resume
        </div>
        <span class="char-count" id="resumeCount">0 chars</span>
      </div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="resumeFile" accept=".pdf,.docx,.txt" />
        <div class="upload-zone-text">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Drop file or <span>browse</span> — PDF, DOCX, TXT
        </div>
        <div class="file-name" id="fileName"></div>
      </div>
      <textarea id="resumeText" placeholder="Or paste your resume text here...&#10;&#10;Include your skills, experience, education and achievements..."></textarea>
    </div>

    <!-- Job Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
          </svg>
          Job Description
        </div>
        <span class="char-count" id="jobCount">0 chars</span>
      </div>
      <textarea id="jobText" style="min-height:282px" placeholder="Paste the full job description here...&#10;&#10;Include requirements, responsibilities, and desired qualifications..."></textarea>
    </div>
  </div>

  <!-- Analyze Button -->
  <div class="analyze-wrap">
    <button class="btn-analyze" id="analyzeBtn" onclick="runAnalysis()">
      <span class="spinner"></span>
      <span class="btn-label">Analyze Match</span>
    </button>
  </div>

  <!-- Results -->
  <div id="results">
    <div class="results-header">Analysis Results</div>

    <!-- Score Hero -->
    <div class="score-hero">
      <div class="score-ring">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle class="ring-bg"   cx="80" cy="80" r="68" stroke-dasharray="427" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="80" cy="80" r="68" id="ringFill"
                  stroke-dasharray="427" stroke-dashoffset="427"/>
        </svg>
        <div class="score-text">
          <div class="score-number" id="scoreNum">0</div>
          <div class="score-pct">%</div>
        </div>
      </div>
      <div class="score-label" id="scoreLabel">—</div>
      <div class="score-sub" id="scoreSub">Calculating...</div>
    </div>

    <!-- Sub-Scores -->
    <div class="subscore-grid" id="subscores"></div>

    <!-- Skills -->
    <div class="skills-grid" id="skillsGrid"></div>

    <!-- Recommendations -->
    <div class="recs-card" id="recsCard"></div>

    <!-- Keywords -->
    <div class="keywords-card" id="keywordsCard"></div>
  </div>

</main>

<script>
// ─── Character counters ────────────────────────────────────────────
const resumeTA = document.getElementById('resumeText');
const jobTA    = document.getElementById('jobText');

resumeTA.addEventListener('input', () => {
  document.getElementById('resumeCount').textContent = resumeTA.value.length.toLocaleString() + ' chars';
});
jobTA.addEventListener('input', () => {
  document.getElementById('jobCount').textContent = jobTA.value.length.toLocaleString() + ' chars';
});

// ─── File upload UI ────────────────────────────────────────────────
const fileInput = document.getElementById('resumeFile');
fileInput.addEventListener('change', () => {
  const fn = document.getElementById('fileName');
  if (fileInput.files[0]) {
    fn.style.display = 'block';
    fn.textContent   = '✓ ' + fileInput.files[0].name;
    resumeTA.placeholder = 'File selected — text extraction will happen on analysis.';
  }
});

// ─── Analysis ─────────────────────────────────────────────────────
async function runAnalysis() {
  const btn   = document.getElementById('analyzeBtn');
  const err   = document.getElementById('errorBanner');
  err.style.display = 'none';

  const fd = new FormData();
  const f  = fileInput.files[0];
  if (f) fd.append('resume_file', f);
  fd.append('resume_text', resumeTA.value);
  fd.append('job_text',    jobTA.value);

  btn.classList.add('loading');
  btn.disabled = true;
  btn.querySelector('.btn-label').textContent = 'Analyzing…';

  try {
    const res  = await fetch('/analyze', { method: 'POST', body: fd });
    const json = await res.json();

    if (!res.ok || json.error) {
      err.textContent    = json.error || 'Something went wrong.';
      err.style.display  = 'block';
      return;
    }
    renderResults(json.data);
  } catch(e) {
    err.textContent   = 'Network error — is the server running?';
    err.style.display = 'block';
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
    btn.querySelector('.btn-label').textContent = 'Analyze Match';
  }
}

// ─── Render Results ────────────────────────────────────────────────
function renderResults(d) {
  const el = id => document.getElementById(id);
  el('results').style.display = 'block';
  el('results').scrollIntoView({ behavior: 'smooth', block: 'start' });

  // Score ring animation
  const pct = d.overall_score;
  const circumference = 427;
  setTimeout(() => {
    el('ringFill').style.strokeDashoffset = circumference - (pct / 100) * circumference;
    el('ringFill').style.stroke = scoreColor(pct);
  }, 100);

  // Counter animation
  animateCounter(el('scoreNum'), 0, pct, 1200);
  el('scoreLabel').textContent   = d.label;
  el('scoreLabel').style.color   = scoreColorHex(pct);
  el('scoreSub').textContent     = scoreMessage(pct);

  // Sub-scores
  const scoreItems = [
    { name: 'Semantic',    val: d.scores.semantic,    color: '#00d4ff' },
    { name: 'Keyword',     val: d.scores.keyword,     color: '#7c3aed' },
    { name: 'Technical',   val: d.scores.technical,   color: '#10b981' },
    { name: 'Soft Skills', val: d.scores.soft_skills, color: '#f59e0b' },
  ];
  el('subscores').innerHTML = scoreItems.map(s => `
    <div class="subscore-card">
      <div class="subscore-name">${s.name}</div>
      <div class="subscore-val" style="color:${s.color}">${s.val}%</div>
      <div class="mini-bar-track">
        <div class="mini-bar-fill" style="background:${s.color}; width:0%"
             data-width="${s.val}%"></div>
      </div>
    </div>
  `).join('');
  setTimeout(() => {
    document.querySelectorAll('.mini-bar-fill').forEach(b => {
      b.style.width = b.dataset.width;
    });
  }, 200);

  // Skills
  const sk = d.skills;
  el('skillsGrid').innerHTML = [
    { title: 'Matched Tech Skills', tags: sk.matched_tech, cls: 'tag-green', dot: '#10b981', empty: 'No matching tech skills found.' },
    { title: 'Missing Tech Skills', tags: sk.missing_tech, cls: 'tag-red',   dot: '#ef4444', empty: 'Great — no missing tech skills!' },
    { title: 'Matched Soft Skills', tags: sk.matched_soft, cls: 'tag-blue',  dot: '#7c3aed', empty: 'No soft skills detected.' },
    { title: 'Bonus Skills',        tags: sk.bonus_tech,   cls: 'tag-yellow',dot: '#f59e0b', empty: 'No extra skills detected.' },
  ].map(g => `
    <div class="skill-card">
      <div class="skill-card-title">
        <div class="skill-dot" style="background:${g.dot}"></div>${g.title}
        <span style="margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim)">${g.tags.length}</span>
      </div>
      <div class="tags">
        ${g.tags.length
          ? g.tags.map(t => `<span class="tag ${g.cls}">${t}</span>`).join('')
          : `<span class="empty-skills">${g.empty}</span>`}
      </div>
    </div>
  `).join('');

  // Recommendations
  el('recsCard').innerHTML = `
    <div class="recs-title">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Recommendations
    </div>
    ${d.recommendations.map(r => `
      <div class="rec-item">
        <div class="rec-icon">→</div>
        <div>${r}</div>
      </div>`).join('')}
  `;

  // Keywords
  el('keywordsCard').innerHTML = `
    <div class="keywords-title">Top Resume Keywords</div>
    <div class="tags">
      ${d.top_resume_keywords.map(k => `<span class="tag tag-cyan">${k}</span>`).join('')}
    </div>
  `;
}

// ─── Helpers ──────────────────────────────────────────────────────
function animateCounter(el, from, to, duration) {
  const step = (to - from) / (duration / 16);
  let current = from;
  const timer = setInterval(() => {
    current = Math.min(current + step, to);
    el.textContent = Math.round(current);
    if (current >= to) clearInterval(timer);
  }, 16);
}

function scoreColor(pct) {
  if (pct >= 80) return '#10b981';
  if (pct >= 60) return '#00d4ff';
  if (pct >= 40) return '#f59e0b';
  return '#ef4444';
}
function scoreColorHex(pct) { return scoreColor(pct); }
function scoreMessage(pct) {
  if (pct >= 80) return 'Your resume is a strong fit for this role.';
  if (pct >= 60) return 'Good alignment — a few tweaks will strengthen your application.';
  if (pct >= 40) return 'Moderate match — consider tailoring your resume.';
  return 'Low match — significant customization recommended.';
}
